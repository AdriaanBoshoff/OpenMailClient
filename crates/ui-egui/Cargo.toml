[package]
name = "openmailclient-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenMailClient egui front end (Outlook-Classic-style ribbon UI); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
openmailclient-model = { workspace = true }
openmailclient-engine = { workspace = true }
openmailclient-layout = { workspace = true }
openmailclient-formats = { workspace = true }
openmailclient-fonts = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
web-time = { workspace = true }
# Decodes pictures a message carries as attachments; nothing else is read with it.
image = { workspace = true, features = ["jpeg", "gif", "bmp"] }
# Pictures copied and pasted, written into HTML.
base64 = { workspace = true }

# The clipboard as HTML and pictures, for formatted text copied and pasted: the toolkit's
# carries only text. Already built for the toolkit's own text clipboard.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.6"
# The control channel's key, from the system's source of randomness.
getrandom = "0.3"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
openmailclient-net = { workspace = true, features = ["fake"] }
openmailclient-mime = { workspace = true }
