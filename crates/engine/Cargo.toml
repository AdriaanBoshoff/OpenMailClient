[package]
name = "openmailclient-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenMailClient engine: session, stores, command registry, Outlook feature catalog, sample mailbox"

[lints]
workspace = true

[dependencies]
openmailclient-model = { workspace = true }
openmailclient-mime = { workspace = true }
openmailclient-msg = { workspace = true }
openmailclient-pst = { workspace = true }
openmailclient-formats = { workspace = true }
openmailclient-fonts = { workspace = true }
openmailclient-layout = { workspace = true }
openmailclient-render = { workspace = true }
openmailclient-pdf = { workspace = true }
openmailclient-net = { workspace = true }
# Decodes the pictures a message body shows.
image = { workspace = true, features = ["jpeg", "gif", "bmp", "webp", "tiff"] }
resvg = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
log = { workspace = true }
# The time zone the machine keeps.
chrono = { workspace = true }

# The name the system gives its time zone; chrono already depends on it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iana-time-zone = { version = "0.1", features = ["fallback"] }

[target.'cfg(windows)'.dependencies]
# Outlook Classic's profiles are read from the registry to be imported; nothing is written.
windows-registry = "0.6.1"

[dev-dependencies]
openmailclient-net = { workspace = true, features = ["fake"] }
# Builds the attached objects the tests read.
cfb = { workspace = true }
