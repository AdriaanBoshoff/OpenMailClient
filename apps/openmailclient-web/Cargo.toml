[package]
name = "openmailclient-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "OpenMailClient in a web browser: the same window, built for WebAssembly"

[lints]
workspace = true

[dependencies]
openmailclient-engine = { workspace = true }
openmailclient-ui-egui = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "glow", "accesskit"] }
egui = { workspace = true }
# The browser's clock and time zone for chrono, where the system has none.
chrono = { workspace = true, features = ["wasmbind"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
# What the page is asked for: a file chosen, a download, the browser's storage, a link opened.
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement", "HtmlAnchorElement",
    "File", "FileList", "Blob", "BlobPropertyBag", "Url", "Storage", "console",
] }
web-time = { workspace = true }
